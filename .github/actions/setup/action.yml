name: setup
description: Install pinned pnpm and Node with the pnpm store cached, then install dependencies.
runs:
  using: composite
  steps:
    # pnpm first (it runs under the runner's default Node), so setup-node can cache its store.
    - shell: bash
      run: npm install -g pnpm@11.3.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.8.1
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
